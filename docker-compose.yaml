version: '3.9'

services:
  backend:
    build:
      context: ./xeghepBE
      dockerfile: Dockerfile
    expose:
      - "8080"
    environment:
      TZ: Asia/Ho_Chi_Minh
      SERVER_PORT: 8080
      LOGGING_FILE_PATH: /app/logs
      JAVA_TOOL_OPTIONS: -Xmx3g -Xms1g
      # Chỉ cần domain chính
      ALLOWED_ORIGINS: "https://xeghepnghiaphat.io.vn"

      # === KẾT NỐI DATABASE ===
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}

    networks:
      - dokploy-network
    volumes:
      - backend_logs:/app/logs
      - ticket_images:/app/data/ticket-images
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.5"
          memory: 3.5G
    labels:
      - "traefik.enable=true"
      # Rule: Chỉ nhận các request có đường dẫn bắt đầu bằng /transport-service
      - "traefik.http.routers.backend.rule=Host(`xeghepnghiaphat.io.vn`) && PathPrefix(`/transport-service`)"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls.certResolver=letsencrypt"
      - "traefik.http.services.backend.loadbalancer.server.port=8080"
      # Độ ưu tiên cao hơn Frontend để bắt đúng path /transport-service
      - "traefik.http.routers.backend.priority=10"

  frontend:
    build:
      context: ./xeghepFE
      dockerfile: Dockerfile
      args:
        # Cấu hình để FE gọi đúng path của Backend
        VITE_API_BASE_URL: /transport-service
    expose:
      - "80"
    networks:
      - dokploy-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    labels:
      - "traefik.enable=true"
      # Rule: Nhận tất cả các request còn lại gửi đến domain chính
      - "traefik.http.routers.frontend.rule=Host(`xeghepnghiaphat.io.vn`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certResolver=letsencrypt"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
      # Độ ưu tiên thấp hơn Backend
      - "traefik.http.routers.frontend.priority=1"

networks:
  dokploy-network:
    external: true

volumes:
  backend_logs:
    driver: local
  ticket_images:
    driver: local
