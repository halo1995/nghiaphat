version: '3.9'

services:
  backend:
    build:
      context: ./xeghepBE
      dockerfile: Dockerfile
    expose:
      - "8080"
    environment:
      TZ: Asia/Ho_Chi_Minh
      SERVER_PORT: 8080
      LOGGING_FILE_PATH: /app/logs
      JAVA_TOOL_OPTIONS: -Xmx3g -Xms1g
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://app.xeghepnghiaphat.io.vn,https://xeghepnghiaphat.io.vn,https://api.xeghepnghiaphat.io.vn,http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173}

      # === KẾT NỐI DATABASE (sẽ dùng Internal URL) ===
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}

    networks:
      - dokploy-network
    volumes:
      - backend_logs:/app/logs
      - ticket_images:/app/data/ticket-images
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.5"
          memory: 3.5G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`api.xeghepnghiaphat.io.vn`)"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls.certResolver=letsencrypt"
      - "traefik.http.services.backend.loadbalancer.server.port=8080"

  frontend:
    build:
      context: ./xeghepFE
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    expose:
      - "80"
    networks:
      - dokploy-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`app.xeghepnghiaphat.io.vn`) || Host(`xeghepnghiaphat.io.vn`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certResolver=letsencrypt"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"

networks:
  dokploy-network:
    external: true

volumes:
  backend_logs:
    driver: local
  ticket_images:
    driver: local
