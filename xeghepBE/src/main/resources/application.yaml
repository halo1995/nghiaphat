spring:
  application:
    name: transport-service
    code: ${APPLICATION_CODE:001}
  cloud:
    compatibility-verifier:
      enabled: false
  compression:
    enabled: true
  error:
    whitelabel:
      enabled: false
  profiles:
    active: ${PROFILE_NAME:dev}
  sleuth:
    sampler:
      probability: 100
  jackson:
    default-property-inclusion: always
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://103.162.20.246:5432/nghiaphat}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:d0oKYItd31JU8bXNUAKd}
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update

jwt:
  secret: ${JWT_SECRET:GeCK9gAKzii51PHdlxBv7XRvYWYvyxn4DECYEEwmBYE=}
  expiration: ${JWT_EXPIRATION:86400000}

springdoc:
  api-docs:
    enabled: ${API_ENABLED:true}
  swagger-ui:
    path: index.html
    enabled: true
    config-url: ${SWAGGER_CONFIG_URL:/v3/api-docs/swagger-config}
    disable-swagger-default-url: true
    url: ${SWAGGER_UI_URL:/v3/api-docs}

server:
  forward-headers-strategy: native
  tomcat:
    threads:
      max: ${REQUEST_MAX_THREAD:2500}

payment:
  attachments:
    base-dir: ${PAYMENT_ATTACHMENTS_BASE_DIR:/app/data/ticket-images}
    retention-days: ${PAYMENT_ATTACHMENTS_RETENTION_DAYS:40}
    max-files: ${PAYMENT_ATTACHMENTS_MAX_FILES:3}
    max-file-size-bytes: ${PAYMENT_ATTACHMENTS_MAX_FILE_SIZE_BYTES:10485760}

app:
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:https://app.xeghepnghiaphat.io.vn,https://api.xeghepnghiaphat.io.vn,http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173}