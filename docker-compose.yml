version: '3.9'

services:
  backend:
    build:
      context: ./xeghepBE
      dockerfile: Dockerfile
    expose:
      - "8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/postgres
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: Xf(I=1p*e<$$+A(B7^dGi
      LOGGING_FILE_PATH: /app/logs
      SERVER_PORT: 8080
      JAVA_TOOL_OPTIONS: -Xmx3g -Xms1g
    depends_on:
      - db
    networks:
      - app-network
    volumes:
      - backend_logs:/app/logs
      - ticket_images:/app/data/ticket-images
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.5"
          memory: 3.5G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./xeghepFE
      dockerfile: Dockerfile
    networks:
      - app-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Xf(I=1p*e<$$+A(B7^dGi
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    networks:
      - app-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 3G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
      - certs:/acme.sh
      - certbot_www:/var/www/certbot
    depends_on:
      - backend
      - frontend
      - postgresus
    networks:
      - app-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ===== POSTGRESUS THẬT - BACKUP TỰ ĐỘNG =====
  postgresus:
    image: rostislavdugin/postgresus:latest
    restart: unless-stopped
    depends_on:
      - db
    environment:
      # Cấu hình cơ bản - bạn sẽ chỉnh chi tiết trong giao diện web lần đầu
      PUID: "1000"
      PGID: "1000"
      TZ: Asia/Ho_Chi_Minh
      POSTGRES_HOST: db
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Xf(I=1p*e<$$+A(B7^dGi
      # Backup mỗi ngày lúc 2h sáng, giữ 30 bản mới nhất
      BACKUP_CRON_EXPRESSION: "0 2 * * *"
      BACKUP_NUM_TO_KEEP: "30"
    volumes:
      - postgresus_config:/config
      - postgres_data:/var/lib/postgresql/data:ro # chỉ đọc để backup
      - backups:/backups # thư mục backup local (bạn có thể mount ra host)
    networks:
      - app-network
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  certbot:
    image: neilpang/acme.sh:3.0.7
    container_name: certbot
    networks:
      - app-network
    volumes:
      - certs:/acme.sh
      - certbot_www:/var/www/certbot
    command: daemon
    entrypoint: >
      sh -c " sleep 10 && acme.sh --set-default-ca --server letsencrypt && acme.sh --issue -d xeghepnghiaphat.io.vn --webroot /var/www/certbot --keylength 2048 \
        --pre-hook 'nginx -s stop || true' \
        --post-hook 'nginx -s reload || true' &&
      acme.sh --install-cert -d xeghepnghiaphat.io.vn \
        --key-file /acme.sh/xeghepnghiaphat.io.vn/key.pem \
        --fullchain-file /acme.sh/xeghepnghiaphat.io.vn/fullchain.pem \
        --reloadcmd 'nginx -s reload' &&
      acme.sh --cron --home /acme.sh "
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  backend_logs:
    driver: local
  ticket_images:
    driver: local
  certs:
    driver: local
  postgresus_config:
    driver: local
  backups:
    # bạn có thể mount ra host nếu muốn: ./backups:/backups
    driver: local
  certbot_www:
    driver: local
