services:
  backend:
    build:
      context: ./xeghepBE
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      POSTGRES_URL: jdbc:postgresql://db:5432/postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Xf(I=1p*e<$+A(B7^dGi
      LOGGING_FILE_PATH: /app/logs
    depends_on:
      - db
    networks:
      - app-network
    volumes:
      - backend_logs:/app/logs
      - ticket_images:/app/data/ticket-images
    restart: unless-stopped
    mem_limit: 1024m     # NOTE: Thay cho deploy.resources.memory
    cpus: 1           # NOTE: Thay cho deploy.resources.cpus
 
  frontend:
    build:
      context: ./xeghepFE
      dockerfile: Dockerfile
    ports:
      - "3000:80"       # NOTE: Nếu FE chạy bằng React dev server thì đổi thành "3000:3000"
    depends_on:
      - backend
    networks:
      - app-network
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
 
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Xf(I=1p*e<$+A(B7^dGi
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
    networks:
      - app-network
    restart: unless-stopped
    mem_limit: 1024m
    cpus: 1
 
networks:
  app-network:
    driver: bridge
  monitor-network:
    driver: bridge
    # NOTE: tách riêng mạng monitoring để cô lập lưu lượng metrics khỏi app traffic
 
volumes:
  postgres_data:
    # NOTE: Bỏ external:true -> để docker-compose tự tạo volume
  backend_logs:
    driver: local
  ticket_images:
    driver: local